[workspace]
resolver = "3"
# Crates are added here as they land, so `cargo test --workspace` is always
# green on the default branch. Remaining: voxide-audio, voxide-asr,
# voxide-wake, voxide-pipeline.
members = [
    "crates/voxide-core",
    "crates/voxide-intent",
    "crates/voxide-actions",
    "crates/voxide",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MansurPro/voxide"
authors = ["MansurPro <mansurpro@aikynetix.com>"]
keywords = ["voice", "speech", "accessibility", "offline", "cli"]
categories = ["command-line-utilities", "accessibility", "multimedia::audio"]

[workspace.dependencies]
# --- shared, always on -------------------------------------------------
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
walkdir = "2.5"
libc = "0.2"

# --- CLI ---------------------------------------------------------------
clap = { version = "4.5", features = ["derive"] }

# --- audio (feature-gated at the crate level) --------------------------
hound = "3.5"
cpal = "0.16"
rubato = "0.16"

# --- ML backends (feature-gated at the crate level) --------------------
# rustls rather than native-tls so a build needs no system OpenSSL, and
# `image-models` stays off: voxide only ever embeds text.
fastembed = { version = "5.17", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
] }

# --- scripting (feature-gated) -----------------------------------------
mlua = { version = "0.11", features = ["lua54", "vendored"] }

# --- dev ---------------------------------------------------------------
tempfile = "3"
insta = "1.43"

# --- internal ----------------------------------------------------------
voxide-core = { path = "crates/voxide-core", version = "0.1.0" }
voxide-intent = { path = "crates/voxide-intent", version = "0.1.0" }
voxide-actions = { path = "crates/voxide-actions", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
