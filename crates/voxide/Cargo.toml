[package]
name = "voxide"
description = "Offline, semantic voice control for your development workflow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "voxide"

[[bin]]
name = "voxide"
path = "src/main.rs"

[features]
default = []
embed = ["voxide-intent/embed"]
lua = ["voxide-actions/lua"]
mic = ["voxide-audio/mic"]
vosk = ["voxide-asr/vosk"]

[dependencies]
voxide-core.workspace = true
voxide-intent.workspace = true
voxide-models.workspace = true
voxide-actions.workspace = true
voxide-audio.workspace = true
voxide-asr.workspace = true
voxide-wake.workspace = true
voxide-pipeline.workspace = true

anyhow.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
