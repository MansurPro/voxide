# Golden phrase corpus for the bundled `cargo` and `git` packs.
#
# Cases are written the way somebody would actually speak, NOT by copying the
# training phrases out of the packs. Roughly a third are deliberate paraphrases
# that share little or no vocabulary with any training phrase -- those are the
# cases that separate semantic matching from the lexical baseline, and they are
# the reason this file exists.
#
# `voxide eval --compare` scores both backends against this corpus.

# --- cargo.test ------------------------------------------------------------
[[case]]
say = "run the tests"
expect = "cargo.test"

[[case]]
say = "run the test suite"
expect = "cargo.test"

[[case]]
say = "let's test this"
expect = "cargo.test"

[[case]]
say = "make sure everything still passes"
expect = "cargo.test"
note = "paraphrase: no shared vocabulary with any training phrase"

[[case]]
say = "are the tests green"
expect = "cargo.test"
note = "paraphrase"

