[graph]
all-features = false

[licenses]
# voxide ships as MIT OR Apache-2.0. Only permissive licenses are allowed in
# the dependency tree so that downstream users inherit no copyleft obligation.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# voxide deliberately depends on no git forks. Every dependency must be a
# published crates.io release so that `cargo install voxide` works and so the
# supply chain is auditable.
allow-git = []

[advisories]
version = 2
yanked = "deny"
